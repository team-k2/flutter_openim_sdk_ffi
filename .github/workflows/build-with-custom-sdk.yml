name: Build FFI with Custom SDK Core

on:
  # 手動觸發 - 可以在任何分支執行
  workflow_dispatch:
    inputs:
      sdk_core_branch:
        description: 'openim-sdk-core branch to use'
        required: false
        default: 'completeEditMessage'  # 預設使用 completeEditMessage 分支
      platforms:
        description: 'Platforms to build (comma-separated: ios,android,windows,macos,linux or all)'
        required: false
        default: 'all'

  # 自動觸發 - 特定分支
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'completeEditMessage'  # 添加當前分支
    paths:
      - '**.dart'
      - '**.go'
      - '.github/workflows/**'

  pull_request:
    branches: [ main ]

env:
  GO_VERSION: '1.21'
  ANDROID_API_LEVEL: 21
  # 自定義 SDK Core 的倉庫設置
  SDK_CORE_REPO: 'team-k2/openim-sdk-core'  # ⚠️ 修正：不要加 https://github.com/
  SDK_CORE_BRANCH: ${{ github.event.inputs.sdk_core_branch || 'completeEditMessage' }}

jobs:
  prepare-custom-sdk:
    name: Prepare Custom SDK Core
    runs-on: ubuntu-latest
    outputs:
      sdk-version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout flutter_openim_sdk_ffi
        uses: actions/checkout@v4
        with:
          path: flutter_sdk

      - name: Checkout custom openim-sdk-core
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SDK_CORE_REPO }}  # ✅ 這裡會使用 team-k2/openim-sdk-core
          ref: ${{ env.SDK_CORE_BRANCH }}       # ✅ 會使用 completeEditMessage 分支
          path: sdk_core
          # 如果是公開倉庫，不需要 token

      - name: Get SDK Core version
        id: get-version
        run: |
          cd sdk_core
          VERSION=$(git rev-parse --short HEAD)
          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "SDK Core version: $VERSION"
          echo "SDK Core branch: $BRANCH"
          echo "Repository: ${{ env.SDK_CORE_REPO }}"

      - name: Upload SDK Core as artifact
        uses: actions/upload-artifact@v4
        with:
          name: custom-sdk-core
          path: sdk_core

  build-ios:
    name: Build iOS Framework with Custom SDK
    runs-on: macos-latest
    needs: prepare-custom-sdk
    steps:
      - name: Download custom SDK Core
        uses: actions/download-artifact@v4
        with:
          name: custom-sdk-core
          path: ./openim-sdk-core

      - name: Checkout flutter_openim_sdk_ffi
        uses: actions/checkout@v4
        with:
          path: ./flutter_sdk

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Configure go.mod to use local SDK
        run: |
          cd openim-sdk-core

          # 確保 go.mod 存在
          if [ ! -f go.mod ]; then
            go mod init github.com/openimsdk/openim-sdk-core/v3
          fi

          # 下載依賴
          go mod tidy

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          gomobile init

      - name: Build iOS Framework
        run: |
          cd openim-sdk-core
          export PATH=$PATH:$(go env GOPATH)/bin

          echo "Building iOS Framework from branch: ${{ env.SDK_CORE_BRANCH }}"

          # 編譯 iOS Framework
          gomobile bind -v \
            -target=ios \
            -o ../flutter_sdk/ios/OpenIMCore.xcframework \
            -ldflags="-s -w -X main.SDKVersion=${{ needs.prepare-custom-sdk.outputs.sdk-version }}" \
            ./open_im_sdk ./open_im_sdk_callback

      - name: Verify Framework
        run: |
          echo "Verifying iOS Framework..."
          ls -la flutter_sdk/ios/
          if [ -d "flutter_sdk/ios/OpenIMCore.xcframework" ]; then
            echo "✅ iOS Framework built successfully"
            file flutter_sdk/ios/OpenIMCore.xcframework/ios-arm64/OpenIMCore.framework/OpenIMCore
          else
            echo "❌ iOS Framework build failed"
            exit 1
          fi

      - name: Upload iOS Framework
        uses: actions/upload-artifact@v4
        with:
          name: ios-framework-custom
          path: flutter_sdk/ios/OpenIMCore.xcframework

  build-android:
    name: Build Android AAR with Custom SDK
    runs-on: ubuntu-latest
    needs: prepare-custom-sdk
    steps:
      - name: Download custom SDK Core
        uses: actions/download-artifact@v4
        with:
          name: custom-sdk-core
          path: ./openim-sdk-core

      - name: Checkout flutter_openim_sdk_ffi
        uses: actions/checkout@v4
        with:
          path: ./flutter_sdk

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure go.mod
        run: |
          cd openim-sdk-core
          if [ ! -f go.mod ]; then
            go mod init github.com/openimsdk/openim-sdk-core/v3
          fi
          go mod tidy

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          gomobile init

      - name: Build Android AAR
        run: |
          cd openim-sdk-core
          export PATH=$PATH:$(go env GOPATH)/bin

          echo "Building Android AAR from branch: ${{ env.SDK_CORE_BRANCH }}"

          gomobile bind -v \
            -target=android \
            -androidapi ${{ env.ANDROID_API_LEVEL }} \
            -o ../flutter_sdk/android/libs/openim-sdk.aar \
            -ldflags="-s -w -X main.SDKVersion=${{ needs.prepare-custom-sdk.outputs.sdk-version }}" \
            ./open_im_sdk ./open_im_sdk_callback

      - name: Verify AAR
        run: |
          echo "Verifying Android AAR..."
          ls -la flutter_sdk/android/libs/
          if [ -f "flutter_sdk/android/libs/openim-sdk.aar" ]; then
            echo "✅ Android AAR built successfully"
            unzip -l flutter_sdk/android/libs/openim-sdk.aar | head -20
          else
            echo "❌ Android AAR build failed"
            exit 1
          fi

      - name: Upload Android AAR
        uses: actions/upload-artifact@v4
        with:
          name: android-aar-custom
          path: flutter_sdk/android/libs/openim-sdk.aar

  build-macos:
    name: Build macOS Library
    runs-on: macos-latest
    needs: prepare-custom-sdk
    steps:
      - name: Download custom SDK Core
        uses: actions/download-artifact@v4
        with:
          name: custom-sdk-core
          path: ./openim-sdk-core

      - name: Checkout flutter_openim_sdk_ffi
        uses: actions/checkout@v4
        with:
          path: ./flutter_sdk

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Configure go.mod
        run: |
          cd openim-sdk-core
          if [ ! -f go.mod ]; then
            go mod init github.com/openimsdk/openim-sdk-core/v3
          fi
          go mod tidy

      - name: Create wrapper for macOS
        run: |
          mkdir -p openim-sdk-core/cmd/clib
          cat > openim-sdk-core/cmd/clib/main.go << 'EOF'
          package main

          import "C"
          import (
              _ "github.com/openimsdk/openim-sdk-core/v3/open_im_sdk"
              _ "github.com/openimsdk/openim-sdk-core/v3/open_im_sdk_callback"
          )

          //export InitSDK
          func InitSDK() {}

          //export GetVersion
          func GetVersion() *C.char {
              return C.CString("custom-${{ needs.prepare-custom-sdk.outputs.sdk-version }}")
          }

          func main() {}
          EOF

      - name: Build macOS Library
        run: |
          cd openim-sdk-core

          echo "Building macOS library from branch: ${{ env.SDK_CORE_BRANCH }}"

          go build -buildmode=c-shared \
            -ldflags="-s -w" \
            -o ../flutter_sdk/macos/libopenim_sdk.dylib \
            ./cmd/clib

      - name: Verify macOS Library
        run: |
          echo "Verifying macOS library..."
          if [ -f "flutter_sdk/macos/libopenim_sdk.dylib" ]; then
            echo "✅ macOS library built successfully"
            file flutter_sdk/macos/libopenim_sdk.dylib
            # 檢查編輯功能是否存在
            nm -g flutter_sdk/macos/libopenim_sdk.dylib | grep -i edit || echo "Warning: Edit functions not found"
          else
            echo "❌ macOS library build failed"
            exit 1
          fi

      - name: Upload macOS Library
        uses: actions/upload-artifact@v4
        with:
          name: macos-library-custom
          path: flutter_sdk/macos/libopenim_sdk.dylib

  build-windows:
    name: Build Windows DLL
    runs-on: windows-latest
    needs: prepare-custom-sdk
    steps:
      - name: Download custom SDK Core
        uses: actions/download-artifact@v4
        with:
          name: custom-sdk-core
          path: ./openim-sdk-core

      - name: Checkout flutter_openim_sdk_ffi
        uses: actions/checkout@v4
        with:
          path: ./flutter_sdk

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup MinGW
        uses: egor-tensin/setup-mingw@v2
        with:
          platform: x64
          static: 0

      - name: Configure go.mod
        shell: bash
        run: |
          cd openim-sdk-core
          if [ ! -f go.mod ]; then
            go mod init github.com/openimsdk/openim-sdk-core/v3
          fi
          go mod tidy

      - name: Create wrapper for Windows
        shell: bash
        run: |
          mkdir -p openim-sdk-core/cmd/clib
          cat > openim-sdk-core/cmd/clib/main.go << 'EOF'
          package main

          import "C"
          import (
              _ "github.com/openimsdk/openim-sdk-core/v3/open_im_sdk"
              _ "github.com/openimsdk/openim-sdk-core/v3/open_im_sdk_callback"
          )

          //export InitSDK
          func InitSDK() {}

          //export GetVersion
          func GetVersion() *C.char {
              return C.CString("custom-${{ needs.prepare-custom-sdk.outputs.sdk-version }}")
          }

          func main() {}
          EOF

      - name: Build Windows DLL
        shell: bash
        run: |
          cd openim-sdk-core

          echo "Building Windows DLL from branch: ${{ env.SDK_CORE_BRANCH }}"

          export CGO_ENABLED=1
          go build -buildmode=c-shared \
            -ldflags="-s -w" \
            -o ../flutter_sdk/windows/openim_sdk.dll \
            ./cmd/clib

      - name: Verify Windows DLL
        shell: bash
        run: |
          echo "Verifying Windows DLL..."
          if [ -f "flutter_sdk/windows/openim_sdk.dll" ]; then
            echo "✅ Windows DLL built successfully"
            file flutter_sdk/windows/openim_sdk.dll
          else
            echo "❌ Windows DLL build failed"
            exit 1
          fi

      - name: Upload Windows DLL
        uses: actions/upload-artifact@v4
        with:
          name: windows-library-custom
          path: flutter_sdk/windows/openim_sdk.dll

  package-release:
    name: Package All Platforms
    runs-on: ubuntu-latest
    needs: [build-ios, build-android, build-macos, build-windows]
    steps:
      - name: Checkout flutter_openim_sdk_ffi
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Create release structure
        run: |
          mkdir -p release/{ios,android,macos,windows}

          # iOS
          if [ -d "artifacts/ios-framework-custom" ]; then
            cp -r artifacts/ios-framework-custom/* release/ios/
            echo "✅ iOS Framework packaged"
          fi

          # Android
          if [ -f "artifacts/android-aar-custom/openim-sdk.aar" ]; then
            cp artifacts/android-aar-custom/openim-sdk.aar release/android/
            echo "✅ Android AAR packaged"
          fi

          # macOS
          if [ -f "artifacts/macos-library-custom/libopenim_sdk.dylib" ]; then
            cp artifacts/macos-library-custom/libopenim_sdk.dylib release/macos/
            echo "✅ macOS library packaged"
          fi

          # Windows
          if [ -f "artifacts/windows-library-custom/openim_sdk.dll" ]; then
            cp artifacts/windows-library-custom/openim_sdk.dll release/windows/
            echo "✅ Windows DLL packaged"
          fi

      - name: Create version info
        run: |
          cat > release/VERSION.json << EOF
          {
            "build_date": "$(date -u +"%Y-%m-%d %H:%M:%S UTC")",
            "sdk_core_repo": "${{ env.SDK_CORE_REPO }}",
            "sdk_core_branch": "${{ env.SDK_CORE_BRANCH }}",
            "sdk_core_version": "${{ needs.prepare-custom-sdk.outputs.sdk-version }}",
            "flutter_sdk_commit": "${{ github.sha }}",
            "platforms": {
              "ios": "arm64",
              "android": "armeabi-v7a, arm64-v8a, x86_64",
              "macos": "x86_64, arm64",
              "windows": "x64"
            }
          }
          EOF

          echo "Version info:"
          cat release/VERSION.json

      - name: Create README
        run: |
          cat > release/README.md << EOF
          # OpenIM SDK FFI Libraries

          Built from custom SDK Core:
          - Repository: https://github.com/${{ env.SDK_CORE_REPO }}
          - Branch: ${{ env.SDK_CORE_BRANCH }}
          - Commit: ${{ needs.prepare-custom-sdk.outputs.sdk-version }}
          - Build Date: $(date -u +"%Y-%m-%d %H:%M:%S UTC")

          ## Included Platforms

          | Platform | File | Architecture |
          |----------|------|-------------|
          | iOS | ios/OpenIMCore.xcframework | arm64 |
          | Android | android/openim-sdk.aar | multi-arch |
          | macOS | macos/libopenim_sdk.dylib | universal |
          | Windows | windows/openim_sdk.dll | x64 |

          ## Usage

          1. Copy the appropriate library to your Flutter project
          2. Ensure your Flutter SDK references these libraries
          3. Run your Flutter application
          EOF

      - name: Create release archive
        run: |
          cd release
          tar -czf ../flutter-openim-sdk-custom-${{ needs.prepare-custom-sdk.outputs.sdk-version }}.tar.gz .
          zip -r ../flutter-openim-sdk-custom-${{ needs.prepare-custom-sdk.outputs.sdk-version }}.zip .

          echo "📦 Release packages created:"
          ls -lh ../flutter-openim-sdk-custom-*

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: flutter-openim-sdk-custom-release
          path: |
            flutter-openim-sdk-custom-*.tar.gz
            flutter-openim-sdk-custom-*.zip

      - name: Create GitHub Release (if tagged)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            flutter-openim-sdk-custom-*.tar.gz
            flutter-openim-sdk-custom-*.zip
          body: |
            ## Custom SDK Build

            This release was built with custom openim-sdk-core:
            - Repository: https://github.com/${{ env.SDK_CORE_REPO }}
            - Branch: ${{ env.SDK_CORE_BRANCH }}
            - Version: ${{ needs.prepare-custom-sdk.outputs.sdk-version }}

            ### ✅ Platforms Included
            - iOS (arm64)
            - Android (multi-arch)
            - macOS (universal)
            - Windows (x64)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}